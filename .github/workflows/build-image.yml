name: Build image

on:
  pull_request:
    paths:
      - docker/**
      - .github/workflows/build-image.yml
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs only build (the `kernel-builder --version` check in the Dockerfile
      # validates the image); pushes to main also publish to GHCR. The action
      # defaults to `:latest`; the `sha-<commit>` tag is immutable, for
      # pinning via the `image` input or rolling back a bad push.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
