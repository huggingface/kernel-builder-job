name: Build Kernel

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build kernel via HF Jobs
        uses: huggingface/kernel-builder-job@main
        with:
          token: ${{ secrets.HF_TOKEN }}
          namespace: drbh
          # image: uses default nix image
          script: |
            kernel-builder init --name drbh/test-kernel --backends cuda
            cd test-kernel
            git init && git add -A && git commit -m init
            kernel-builder build
        # WARNING: This step passes a secret to a third-party action pinned to @main.
        # Consider pinning to a specific commit SHA and verifying the action source code.
