name: Build Kernel

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build kernel via HF Jobs
        uses: huggingface/kernel-builder-job@main
        with:
          token: ${{ secrets.HF_TOKEN }}
          namespace: drbh
          # image: uses default nix image
          script: |
            kernel-builder init --name drbh/test-kernel --backends cuda
            cd test-kernel
            git init && git add -A && git commit -m init
            kernel-builder build
